# Asks Claude to fix a failed upstream sync or fork release build.
#
# When sync-upstream.yml or build-fork-release.yml fails (rebase conflict,
# test breakage after a clean rebase, build failure on the preview replay),
# this workflow hands the failed run to Claude Code, which diagnoses it,
# reproduces the failure locally, and opens a PR with a fix — or re-runs the
# workflow and comments on the alert issue when the failure is an infra
# flake with nothing to fix.
#
# Auth: uses a Claude Pro/Max SUBSCRIPTION via an OAuth token, not an
# Anthropic API key. One-time setup:
#   1. On your own machine run: claude setup-token
#   2. Copy the token it prints.
#   3. Add it as a repository secret named CLAUDE_CODE_OAUTH_TOKEN.
# If the secret is missing the job skips quietly instead of failing.
# Runs count against the subscription's usage limits.
#
# Like the other fork workflows this file must live on the DEFAULT branch
# (main): `workflow_run` triggers only fire for workflows defined there.
name: Sync autofix

on:
  workflow_run:
    workflows: ["Sync upstream", "Build fork release"]
    types: [completed]
  # Manual runs let you retry an autofix; Claude then locates the most
  # recent failed run itself.
  workflow_dispatch: {}

# One autofix at a time; a second failure while Claude is working would
# fight over branches and the alert issue.
concurrency:
  group: sync-autofix
  cancel-in-progress: false

permissions:
  contents: write # push fix branches
  issues: write # comment on the alert issue
  pull-requests: write # open the fix PR
  actions: write # read the failed run's logs, and re-run it after a flake

jobs:
  autofix:
    if: >-
      github.repository_owner != 'zed-industries' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    # Cold cargo builds on the free 4-core runner are slow; leave headroom
    # for Claude to build and test more than once.
    timeout-minutes: 300
    steps:
      - name: Check for the Claude OAuth token
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set; skipping autofix." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Alert issues are filed without a mention so the self-healing path stays
      # quiet, which means a skipped autofix would leave a broken branch behind
      # a notification nobody receives. Skipping is exactly when a human has to
      # hear about it, so say so out loud.
      - name: Ping the owner when the autofix cannot run
        if: steps.gate.outputs.enabled != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `@${context.repo.owner} the autofix could not run: \`CLAUDE_CODE_OAUTH_TOKEN\` is unset or expired.`,
              '',
              'Nothing has been diagnosed or fixed, so this one needs you by hand. Refresh the secret with `claude setup-token` on your machine, then re-run the failed workflow.',
              '',
              `Autofix run: ${runUrl}`,
            ].join('\n');
            for (const label of ['upstream-sync', 'fork-release-build']) {
              const open = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: label,
              });
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, body,
                });
              }
            }

      - name: Checkout work branch
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          ref: kakoune-mode
          # Full history: fixing a rebase needs the merge-base with upstream.
          fetch-depth: 0
          # Same fine-grained PAT as the sync workflow, needing Contents and
          # Workflows read+write here: pushed branches carry upstream's
          # workflow files, which the default GITHUB_TOKEN cannot push.
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git identity and upstream remote
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch --no-tags upstream main

      - name: Free up disk space
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          sudo docker image prune --all --force || true

      - name: Install system dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: ./script/linux

      - name: Cache Rust build
        if: steps.gate.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Share the sync workflow's cache so Claude's test builds are warm.
          shared-key: sync-upstream
          cache-on-failure: true

      # Snapshot of what Claude could plausibly change, so the verification
      # step below can tell "did the work" from "ended without doing it".
      - name: Record pre-autofix state
        id: before
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FAILED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          git ls-remote --heads origin 'claude/sync-*' | awk '{print $2}' | sort > "${RUNNER_TEMP}/claude-branches-before.txt"
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Requeuing a flake is a real outcome that leaves no branch and no
          # comment, so it is invisible to the checks below and gets reported
          # as a no-op. Re-running bumps the run's attempt count, which is the
          # one durable trace it does leave. Empty on a manual dispatch, where
          # there is no triggering run to compare against.
          if [ -n "$FAILED_RUN" ]; then
            echo "attempt=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}" --jq '.run_attempt')" >> "$GITHUB_OUTPUT"
          fi
          # Lease baseline for the auto-apply force-push. Pinning the SHA we
          # started from means a daily sync or a human pushing kakoune-mode
          # while Claude works makes the push fail instead of silently
          # discarding their commit; a bare --force-with-lease would not,
          # since Claude re-fetches during the rebase and would move the
          # remote-tracking ref it compares against.
          echo "kakoune_mode=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Claude
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # Authenticates `gh` inside Claude's Bash tool (run logs, rerun,
          # issue comments, PR creation).
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # Fallback for Actions writes. SYNC_TOKEN has had "Actions: read
          # and write" since run 30553423031 could not retry a flaky
          # nix-cache job (`gh run rerun` 403'd), so the PAT should handle
          # this itself and this token should go unused. It stays as a net
          # because a fine-grained PAT's permissions can be revoked or
          # narrowed without anything here changing; the prompt tells Claude
          # to report having needed it, so a quietly regressed grant surfaces
          # instead of silently costing us the retry path again.
          GH_TOKEN_ACTIONS: ${{ secrets.GITHUB_TOKEN }}
          # The verification gate (`cargo test -p vim` plus `cargo build -p
          # zed -p settings_ui`) runs 10-20 minutes on this runner even with
          # a warm cache. The Bash tool's stock 2-minute default and
          # 10-minute ceiling cannot fit it, which leaves Claude unable to
          # verify anything and liable to give up without pushing.
          BASH_DEFAULT_TIMEOUT_MS: "1800000" # 30 minutes
          BASH_MAX_TIMEOUT_MS: "5400000" # 90 minutes
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without an explicit token the action mints one via OIDC + the
          # Claude GitHub App, which needs `id-token: write` and the app
          # installed; the PAT skips that exchange entirely.
          github_token: ${{ secrets.SYNC_TOKEN }}
          # Otherwise a run that accomplishes nothing leaves no trace of why.
          # The job log is secret-masked by Actions, unlike an uploaded
          # artifact would be.
          show_full_output: true
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"
            --max-turns 100
          prompt: |
            You are maintaining sweenu/zed, a fork of zed-industries/zed whose
            only delta is Kakoune mode: ~32 commits (mostly
            crates/vim/src/kakoune.rs, assets/keymaps/vim.json and
            docs/src/kakoune.md) carried on the `kakoune-mode` branch directly
            on top of upstream/main. Two scheduled workflows maintain it:
            - "Sync upstream" rebases kakoune-mode onto upstream/main daily and
              force-pushes only if `cargo test -p vim && cargo build -p zed -p
              settings_ui` passes.
            - "Build fork release" replays the kakoune commits onto the newest
              upstream preview tag (vX.Y.Z-pre) and publishes installable
              builds from it.

            One of them failed and your job is to fix it.
            Failed workflow: "${{ github.event.workflow_run.name }}"
            Failed run: ${{ github.event.workflow_run.html_url }}
            (If those are blank this was started manually: use `gh run list`
            to find the most recent failed run of "Sync upstream" or
            "Build fork release".)

            You are checked out on `kakoune-mode` with full history, an
            `upstream` remote already fetched, system dependencies installed,
            and a warm cargo cache. `gh` is authenticated. Proceed like this:

            1. Read the failure: `gh run view <run-id> --log-failed`.
            2. Classify it:
               a. Rebase/replay conflict — upstream changed a file the kakoune
                  commits touch.
               b. Clean rebase but the tests or build failed — upstream
                  changed an API the kakoune code uses.
               c. Infrastructure flake — runner disk, network, tailscale,
                  cache, timeout. The macos and nix-cache jobs of the release
                  workflow cannot be reproduced on this runner, so for those
                  judge from the logs alone.
            3. For (c): do NOT open a PR. Retry with
               `gh run rerun <run-id> --failed`. That should work; if it
               403s the PAT has lost its Actions write permission, so retry
               as `GH_TOKEN="$GH_TOKEN_ACTIONS" gh run rerun <run-id>
               --failed` and say in your issue comment that you had to —
               that is a token regression worth fixing at the source.
               Then explain the flake on the alert issue (label
               `upstream-sync` for the sync workflow, `fork-release-build`
               for the release one). Often there is no such issue open: only
               the release workflow's `build` job files one, so `build-macos`
               and `nix-cache` failures arrive with nothing to comment on.
               Open one yourself in that case, with the right label — a new
               issue and a comment count equally as the outcome for step 6.
               If the rerun succeeded, close the issue and do not mention
               anyone; a requeued flake needs nobody.
            4. For (b): fix the kakoune code on a new branch off kakoune-mode
               named `claude/sync-autofix-<run-id>`. Verify with
               `cargo test -p vim && cargo build -p zed -p settings_ui`.
               Push the branch and open a PR with base `kakoune-mode`, then
               follow step 6. Unlike (a) this is new code you wrote against a
               changed upstream API, not a replay of reviewed commits, so it
               always gets human review no matter how green the gate is.
            5. For (a): perform the failing rebase yourself —
               for the sync workflow: `git rebase upstream/main`;
               for the release replay:
               `git fetch --no-tags upstream "refs/tags/<tag>:refs/tags/<tag>"`
               then `git rebase --committer-date-is-author-date --onto <tag>
               $(git merge-base upstream/main kakoune-mode)`.
               Resolve the conflicts preserving both upstream's intent and the
               kakoune behavior, verify with the same cargo commands, then
               push the fully rebased result to `claude/sync-rebase-<run-id>`.
               Keep that branch after applying: it is the record of what was
               pushed and the way back if the resolution turns out wrong.

               Where that result belongs depends on which workflow failed,
               and the two must never be mixed up. A sync rebase sits on
               `upstream/main`; a release replay sits on a preview tag, which
               is a point on upstream's RELEASE branch and not on main at
               all. Pushing a replay onto `kakoune-mode` would move your work
               branch off main and onto a release tag, silently corrupting
               it.

               - Sync workflow, gate passed: apply it with
                 `git push --force-with-lease=kakoune-mode:${{ steps.before.outputs.kakoune_mode }} origin claude/sync-rebase-<run-id>:kakoune-mode`
                 Then comment on the alert issue listing every conflicted
                 file and how you resolved it, and close it. Do NOT open a PR
                 and do NOT mention anyone — this is the path meant to need
                 nobody. A rebase passing the same gate the daily sync uses
                 to force-push is held to the same standard, so it lands the
                 same way.
               - Release replay, gate passed: force-push the result to
                 `preview-build` and never to `kakoune-mode`. That alone
                 leaves no release: the failed run never reached
                 `bundle-linux` or `gh release create`, and you cannot build
                 one inside this job. Hand it back to the release workflow,
                 which can build `preview-build` as it stands:
                 `gh workflow run build-fork-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f use_existing_replay=true`
                 That input skips the replay entirely and bundles the branch
                 you just pushed, so it will not re-hit the conflict. The
                 workflow re-checks that the preview tag is an ancestor of
                 `preview-build` and fails loudly if upstream cut a newer
                 preview in the meantime, so you do not need to verify that
                 yourself. Then comment what you resolved and that the
                 rebuild is dispatched, and close the issue — no mention.

                 One exception, and it matters: only dispatch when the failed
                 run was a `schedule`. This run was triggered by a
                 "${{ github.event.workflow_run.event }}" run. If that says
                 `workflow_dispatch`, the failing run IS a rebuild like the
                 one you would fire, and dispatching another would loop
                 indefinitely — comment what you found and follow step 6
                 instead. If it is blank you were started manually, so read
                 the failed run's own event with
                 `gh run view <run-id> --json event` and apply the same rule
                 to that. When in doubt, do not dispatch: a missed rebuild
                 costs one mention, a loop costs the whole CI budget.

               Never use the kakoune-mode lease SHA for a rebase you could
               not fully verify. If the gate failed or could not finish,
               leave both branches untouched, open a PR with base
               `kakoune-mode` saying exactly what is unverified and why, note
               that it rewrites history so it must be applied with
               `git push --force-with-lease` rather than merged in GitHub,
               and follow step 6.
            6. Any outcome needing a human — a (b) fix, an unverified rebase,
               a flake you could not requeue, a rebuild that failed on its own
               rebuild, or giving up — gets a comment on the alert issue
               mentioning `@${{ github.repository_owner }}`, and the issue
               stays open. Outcomes needing nobody get no mention and a
               closed issue. That distinction is the whole
               notification design: the mention is the signal, so spending it
               on finished work trains it to be ignored.

            This run is one-shot: when your turn ends the job exits and
            nothing you deferred will ever happen. There is no later. Do not
            wait on, watch, or poll work that outlives the turn — no
            `gh run watch`, no background job you plan to check back on, no
            scheduled wake-up. In particular, after requeuing a flake do NOT
            wait to see whether the rerun passes; you cannot, and a rerun you
            triggered but never wrote up reads from the outside as a run that
            did nothing. Trigger it, write the comment in the same turn, and
            finish. Run 30853827697 requeued a nix-cache flake correctly and
            then scheduled a follow-up to report on it; the follow-up never
            ran, so the fix went unrecorded and the owner was pinged for work
            that was already in hand.

            The verification gate is slow: `cargo test -p vim` followed by
            `cargo build -p zed -p settings_ui` takes 10-20 minutes on this
            runner even with a warm cache. Run each with an explicit long
            Bash timeout (`timeout: 2700000`) and let it finish. Being slow
            is expected and is not a reason to skip verification. That is the
            one kind of waiting that belongs here, because it finishes inside
            the turn.

            Never end a run without leaving a visible outcome. Every run has
            to finish with an applied rebase, or a pushed branch and a PR, or
            an alert issue commented on or opened — a rerun for a flake, or,
            if you could not finish the fix, a note saying exactly how far you
            got and what blocked you. If the fix looks right but you could not get the
            cargo gate to pass or to complete, still push the branch and
            open the PR, and say plainly in the PR body that it is
            unverified and why. A silent run is the one outcome that is
            never acceptable: the branch stays broken and nobody is told.

            PR hygiene: imperative title with no conventional-commit prefix
            and no trailing punctuation, and end the PR body with:

            Release Notes:

            - N/A

      # The action exits 0 whenever the model ends its turn, even if it did
      # nothing at all — which once left a rebase conflict unresolved behind
      # a green check. Turn "no outcome" into a red job so the failure stays
      # visible instead of looking handled.
      - name: Verify the autofix produced an outcome
        id: verify
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SINCE: ${{ steps.before.outputs.at }}
          FAILED_RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT_BEFORE: ${{ steps.before.outputs.attempt }}
        run: |
          git ls-remote --heads origin 'claude/sync-*' | awk '{print $2}' | sort > "${RUNNER_TEMP}/claude-branches-after.txt"
          new_branches=$(comm -13 "${RUNNER_TEMP}/claude-branches-before.txt" "${RUNNER_TEMP}/claude-branches-after.txt")
          if [ -n "$new_branches" ]; then
            echo "Autofix pushed:"
            echo "$new_branches"
            exit 0
          fi

          new_comments=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/comments?since=${SINCE}&per_page=100" \
            --jq 'length')
          if [ "$new_comments" -gt 0 ]; then
            echo "Autofix left $new_comments issue comment(s)."
            exit 0
          fi

          # Opening a fresh alert issue counts too. Only the release
          # workflow's `build` job files one, so a `build-macos` or
          # `nix-cache` failure reaches Claude with no open issue to comment
          # on and the right move is to open one. Counting just comments
          # failed run 30553423031 for doing exactly that.
          touched_issues=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&since=${SINCE}&per_page=100" \
            --jq 'length')
          if [ "$touched_issues" -gt 0 ]; then
            echo "Autofix opened or updated $touched_issues issue(s)."
            exit 0
          fi

          # Requeuing a flake fixes the failure while leaving no branch and no
          # issue behind, so the checks above cannot see it. Run 30853827697
          # requeued a nix-cache flake — which worked, the release completed on
          # the next attempt — and was still reported as a no-op. The rerun
          # bumps the triggering run's attempt count; that is the trace.
          if [ -n "$FAILED_RUN" ] && [ -n "$ATTEMPT_BEFORE" ]; then
            attempt_after=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}" --jq '.run_attempt')
            if [ "$attempt_after" -gt "$ATTEMPT_BEFORE" ]; then
              echo "Autofix requeued run ${FAILED_RUN} (attempt ${ATTEMPT_BEFORE} -> ${attempt_after})."
              echo "::warning::The rerun was not written up on the alert issue, so it left no record beyond this line."
              exit 0
            fi
          fi

          echo "no_outcome=true" >> "$GITHUB_OUTPUT"
          echo "::error::Claude ended without pushing a fix branch, leaving an issue behind, or requeuing the failed run. The original failure is still unfixed; see the run log above for what it did."
          exit 1

      # Every other "needs a human" path is a comment Claude writes itself.
      # This is the one where it wrote nothing, so the mention has to come
      # from the workflow or the red job is the only signal — and a red job
      # is precisely what nobody notices.
      - name: Ping the owner when the autofix produced nothing
        if: always() && steps.verify.outputs.no_outcome == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `@${context.repo.owner} the autofix ran but produced no outcome — nothing pushed, no issue touched. The original failure is unfixed and needs you.`,
              '',
              `Autofix run (the full transcript is in the job log): ${runUrl}`,
            ].join('\n');
            for (const label of ['upstream-sync', 'fork-release-build']) {
              const open = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: label,
              });
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, body,
                });
              }
            }
